<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の街カルテ比較</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>世界の街カルテ比較</h1>
    <p class="lead">世界の街を、同じ物差しで測る実験です。国が違っても同じ分類で数えると、街の個性が見えてきます。そして、物差し自体の偏りも。地区を選ぶと、その街の『カルテ』が出ます。</p>
    <div>
      <strong>同じ1km四方でも、街の表情は違う。</strong>
      <p>難波は飲食57%<br>バンコク旧市街は宿泊14%<br>ソーホーは生活サービス48%<br><small>いずれも登録施設の構成比</small></p>
    </div>
    <div class="buttons" id="areaButtons"></div>
    <button class="compare" id="compareBtn">全地区を比較</button>
    <button class="story" id="storyBtn">物語モード：5つの街と1つの気づき</button>
    <button class="story" id="quizBtn">予想クイズ：先に予想してみる</button>
    <button class="story" id="biasBtn">データの見方：物差しの偏り</button>

    <div class="story-box" id="storyBox" hidden>
      <p id="storyText"></p>
      <div class="story-controls">
        <span id="storyProgress"></span>
        <button id="storyBack">戻る</button>
        <button id="storyNext">次へ</button>
        <button id="storyEnd">おわる</button>
      </div>
    </div>

    <div class="story-box" id="quizBox" hidden>
      <p id="quizQuestion"></p>
      <div class="quiz-choices" id="quizChoices"></div>
      <p id="quizResult" aria-live="polite"></p>
      <div class="story-controls">
        <button id="quizNext" hidden>次の問題</button>
        <button id="quizEnd">おわる</button>
      </div>
    </div>

    <div class="story-box" id="biasBox" hidden>
      <div id="biasContent"></div>
      <button id="biasEnd">閉じる</button>
    </div>

    <p class="lead"><a href="article/">制作記（どう作ったか）を読む →</a></p>
    <div class="summary" id="summary"></div>
    <div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas></div>
    <ul class="legend" id="legend"></ul>
    <footer class="attribution" id="attribution"></footer>
  </aside>
  <div class="mapwrap">
    <main id="map"></main>
    <div class="map-loading" id="mapLoading" hidden>読み込み中…</div>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
