<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>世界の街カルテ比較</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>世界の街カルテ比較</h1>
    <p class="lead">Overture Maps の places データで、約 1km 四方の 5 地区の店・施設の構成を同じ物差しで比べます。</p>
    <div class="buttons" id="areaButtons"></div>
    <button class="compare" id="compareBtn">全地区を比較</button>
    <p class="lead"><a href="article/">制作記（どう作ったか）を読む →</a></p>
    <div class="summary" id="summary"></div>
    <div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas></div>
    <ul class="legend" id="legend"></ul>
    <footer class="attribution" id="attribution"></footer>
  </aside>
  <main id="map"></main>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
