<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>街のカルテ | town-karte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>街のカルテ</h1>
    <p class="sub">town-karte — 世界の街を、同じ物差しで測る</p>
    <p class="lead">世界の5つの街を、同じ分類で数えた記録です。地区を選ぶと、その街のカルテが出ます。数え方をそろえると個性が見える。物差しの偏りも、一緒に見えてきます。</p>
    <div class="discovery">
      <strong>同じ1km四方でも、街の表情は違う。</strong>
      <p>難波は飲食が57%<br>バンコク・旧市街は宿泊が14%<br>ソーホーは生活サービスが48%<br><small>登録施設の構成比</small></p>
    </div>
    <div class="buttons" id="areaButtons"></div>
    <button class="compare" id="compareBtn">5地区を比べる</button>
    <button class="story" id="storyBtn">物語で巡る（5つの街と1つの気づき）</button>
    <button class="story" id="quizBtn">予想クイズ（先に予想してみる）</button>
    <button class="story" id="biasBtn">物差しの偏り（データの見方）</button>

    <div class="story-box" id="storyBox" hidden>
      <p id="storyText"></p>
      <div class="story-controls">
        <span id="storyProgress"></span>
        <span class="story-dots" id="storyDots"></span>
        <button id="storyBack">戻る</button>
        <button id="storyNext">次へ</button>
        <button id="storyEnd">おわる</button>
      </div>
    </div>

    <div class="story-box" id="quizBox" hidden>
      <p id="quizQuestion"></p>
      <div class="quiz-choices" id="quizChoices"></div>
      <p id="quizResult" aria-live="polite"></p>
      <div class="story-controls">
        <button id="quizNext" hidden>次の問題</button>
        <button id="quizEnd">おわる</button>
      </div>
    </div>

    <div class="story-box" id="biasBox" hidden>
      <div id="biasContent"></div>
      <button id="biasEnd">閉じる</button>
    </div>

    <p class="lead"><a href="article/">制作記（どう作ったか）を読む</a></p>
    <div class="summary" id="summary"></div>
    <div class="chart-wrap" id="chartWrap"><canvas id="chart"></canvas></div>
    <ul class="legend" id="legend"></ul>
    <footer class="attribution" id="attribution"></footer>
  </aside>
  <div class="mapwrap">
    <main id="map"></main>
    <div class="map-loading" id="mapLoading" hidden>読み込み中…</div>
  </div>
</div>
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
